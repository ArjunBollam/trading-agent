[project]
name = "paperbot"
version = "0.1.0"
description = "Paper-trading options agent: Claude proposes, code decides."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "openai>=3.37,<4",
    "langgraph>=1.2,<2",
    "alpaca-py>=0.44",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paperbot = "paperbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paperbot", "paperbot.web"]

[tool.setuptools.package-data]
"paperbot.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
